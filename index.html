<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Task</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            text-align: center;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 95vh;
        }
        .card {
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 12px;
        }
        #timer { font-size: 26px; font-weight: bold; color: #2e7d32; }
        .btn {
            display: block;
            background-color: #0288d1;
            color: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-adsterra { background-color: #e65100; }
        .continue-btn {
            background-color: #b0bec5;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            width: 100%;
            cursor: not-allowed;
            font-weight: bold;
        }
        .continue-btn.active {
            background-color: #4caf50;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div>
        <!-- টাইমার সেকশন -->
        <div class="card">
            <div id="timer">00:20</div>
            <p style="margin: 5px 0 0 0; color: #555; font-size: 13px;">নিচের যেকোনো এডে ক্লিক করে ২০ সেকেন্ড অপেক্ষা করুন:</p>
        </div>

        <!-- AADS Banner Ad -->
        <div class="card">
            <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                <iframe data-aa='2456314' src='https://acceptable.a-ads.com/2456314/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
            </div>
        </div>

        <!-- Monetag & Adsterra Direct Links -->
        <div class="card">
            <a href="https://omg10.com/4/11881546" target="_blank" class="btn">▶️ Monetag Ad Link</a>
            <a href="https://www.profitablecpmrate.com/31397479" target="_blank" class="btn btn-adsterra">▶️ Adsterra Smartlink</a>
        </div>
    </div>

    <!-- Continue Button -->
    <button id="claimBtn" class="continue-btn" disabled>Continue</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let timeLeft = 20;
        const timerElement = document.getElementById('timer');
        const claimBtn = document.getElementById('claimBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = "00:" + (timeLeft < 10 ? "0" : "") + timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "Task Complete!";
                claimBtn.disabled = false;
                claimBtn.classList.add("active");
            }
        }, 1000);

        claimBtn.addEventListener('click', () => {
            if (!claimBtn.disabled) {
                tg.sendData("task_completed");
                tg.close();
            }
        });
    </script>
</body>
</html>
